services:
  bot:
    container_name: bot
    build:
      context: .
      dockerfile: ./apps/bot/Dockerfile
    env_file:
      - ./apps/bot/.env
    environment:
      - DATABASE_URL=postgres://postgres:mypassword@pgbouncer:6432/postgres
      - DIRECT_URL=postgres://postgres:mypassword@db:5432/postgres
    depends_on:
      pgbouncer:
        condition: service_healthy

  dashboard:
    container_name: dashboard
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    env_file:
      - ./apps/dashboard/.env
    environment:
      - DATABASE_URL=postgres://postgres:mypassword@pgbouncer:6432/postgres
      - DIRECT_URL=postgres://postgres:mypassword@db:5432/postgres
      - ORIGIN=http://localhost:3000
    depends_on:
      pgbouncer:
        condition: service_healthy
    ports:
      - '3000:3000'

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    ports:
      - '6432:6432'
    environment:
      - DATABASE_URL=postgres://postgres:mypassword@db:5432/postgres
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - SERVER_LIFETIME=3600
      - SERVER_IDLE_TIMEOUT=600
      - MAX_PREPARED_STATEMENTS=100
      - AUTH_TYPE=scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 6432 -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - '5432:5432'
    env_file:
      - ./packages/database/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
