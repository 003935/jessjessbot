services:
  omnivoice:
    build:
      context: .
      dockerfile: ./apps/tts/Dockerfile
    gpus: all
    restart: unless-stopped
    environment:
      - OMNIVOICE_REFERENCE_FILE=/voice/sample2.wav
      - OMNIVOICE_REFERENCE_TEXT=Hi, how are you doing today? I’m recording this so my voice assistant can learn how I sound. I’ll speak naturally and clearly, just like I’m chatting with a friend.
      - OMNIVOICE_VOICE_PROMPT_FILE=/cache/voice-clone-prompt-sample2.pt
      - HF_HOME=/cache
    volumes:
      - ./.local/voice:/voice:ro
      - ./.local/omnivoice-cache:/cache
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=3)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

  bot:
    container_name: bot
    build:
      context: .
      dockerfile: ./apps/bot/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/bot/.env
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@pgbouncer:6432/postgres
      - DIRECT_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/postgres
    depends_on:
      pgbouncer:
        condition: service_healthy
      valkey:
        condition: service_healthy

  dashboard:
    container_name: dashboard
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/dashboard/.env
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@pgbouncer:6432/postgres
      - DIRECT_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/postgres
      - ORIGIN=http://localhost:3000
      - VALKEY_URL=redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}@valkey:6379
    depends_on:
      pgbouncer:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - '3000:3000'

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    ports:
      - '127.0.0.1:6432:6432'
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/postgres
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - SERVER_LIFETIME=3600
      - SERVER_IDLE_TIMEOUT=600
      - MAX_PREPARED_STATEMENTS=100
      - AUTH_TYPE=scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 6432 -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8
    container_name: valkey
    restart: always
    command: ['valkey-server', '--requirepass', '${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}']
    environment:
      - REDISCLI_AUTH=${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
